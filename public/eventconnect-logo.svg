<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">EventConnect logo</title>
  <desc id="desc">Blue EventConnect logo with a calendar and community icon.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B5CFF"/>
      <stop offset="100%" stop-color="#22A7FF"/>
    </linearGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B2D6B"/>
      <stop offset="100%" stop-color="#0B5CFF"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(28 28)">
    <rect x="22" y="30" width="174" height="154" rx="30" fill="none" stroke="url(#blue)" stroke-width="14"/>
    <path d="M62 18v35M156 18v35" stroke="#0B5CFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 78h162" stroke="#0B5CFF" stroke-width="10" stroke-linecap="round"/>

    <!-- Event/community swoosh -->
    <path d="M48 128c18-42 58-61 105-48 18 5 31 15 42 28-20-8-38-10-55-6-30 7-51 28-64 54-8 16-17 28-30 37 0-21 1-43 2-65z"
          fill="url(#blue)"/>
    <path d="M54 163c25 24 67 29 104 12 19-9 35-23 48-42-8 30-27 55-54 69-40 21-82 12-108-13z"
          fill="#0B5CFF" opacity=".82"/>

    <!-- People -->
    <circle cx="112" cy="123" r="14" fill="#0B2D6B"/>
    <circle cx="82" cy="137" r="10" fill="#0B2D6B"/>
    <circle cx="142" cy="137" r="10" fill="#0B2D6B"/>
    <path d="M87 163c0-19 11-30 25-30s25 11 25 30v9H87z" fill="#0B2D6B"/>
    <path d="M61 169c0-14 8-23 19-23 7 0 13 4 16 10-6 6-9 14-9 22H61z" fill="#0B2D6B"/>
    <path d="M153 156c3-6 9-10 16-10 11 0 19 9 19 23h-26c0-5-3-9-9-13z" fill="#0B2D6B"/>

    <!-- Calendar dots -->
    <circle cx="83" cy="93" r="5" fill="#0B5CFF"/>
    <circle cx="108" cy="93" r="5" fill="#22A7FF"/>
    <circle cx="133" cy="93" r="5" fill="#0B5CFF"/>
  </g>

  <!-- Wordmark -->
  <text x="255" y="125" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="#0B2D6B">Event</tspan><tspan fill="#0B5CFF">Connect</tspan>
  </text>

  <line x1="258" y1="155" x2="305" y2="155" stroke="#0B5CFF" stroke-width="3"/>
  <text x="318" y="162" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="16" font-weight="600" letter-spacing="5" fill="#52709D">
    PLAN • MANAGE • CONNECT
  </text>
  <line x1="675" y1="155" x2="722" y2="155" stroke="#0B5CFF" stroke-width="3"/>
</svg>